name: FPL Automated Live Sync

on:
  schedule:
    # Run every 10 minutes during the season
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync FPL Live Data & Standings
        run: |
          python3 scripts/sync-fpl-data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_data.json squadData.js
          if git diff --staged --quiet; then
            echo "No changes in FPL data."
          else
            git commit -m "chore: automated fpl data sync [skip ci]"
            git push
          fi
